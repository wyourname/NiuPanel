name: Promote Panel Release

on:
  workflow_dispatch:
    inputs:
      panel_tag:
        description: '待提升的 Panel Tag，例如 v0.8.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: niupanel-channel-pointer
  cancel-in-progress: false

jobs:
  promote:
    name: Promote Preview to Stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Verify Preview pointer and release
        id: release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PANEL_TAG: ${{ inputs.panel_tag }}
        run: |
          set -euo pipefail
          [[ "$PANEL_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          node scripts/verify-update-channel-index.mjs release/channels/preview.json preview
          test "$(node -p "require('./release/channels/preview.json').release.tag")" = "$PANEL_TAG"
          PANEL_VERSION="${PANEL_TAG#v}"
          ASSET="niupanel_panel_${PANEL_VERSION}.json"
          mkdir immutable-panel
          gh release download "$PANEL_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET" --dir immutable-panel
          export ASSET
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          const pointer = JSON.parse(readFileSync('release/channels/preview.json', 'utf8'))
          const immutable = JSON.parse(readFileSync(`immutable-panel/${process.env.ASSET}`, 'utf8'))
          if (immutable.schema_version !== pointer.schema_version ||
              JSON.stringify(immutable.release) !== JSON.stringify(pointer.release)) {
            throw new Error('Preview pointer does not match the immutable Panel release')
          }
          NODE
          IS_PRERELEASE=$(gh release view "$PANEL_TAG" --repo "$GITHUB_REPOSITORY" \
            --json isPrerelease --jq .isPrerelease)
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Promote GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          PANEL_TAG: ${{ inputs.panel_tag }}
        run: |
          if [ '${{ steps.release.outputs.is_prerelease }}' = true ]; then
            gh release edit "$PANEL_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease=false \
              --latest
          else
            echo "$PANEL_TAG is already stable; continuing channel publication"
          fi

      - name: Move Stable channel pointer
        env:
          PANEL_TAG: ${{ inputs.panel_tag }}
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const value = require('./release/channels/preview.json')
          value.channel = 'stable'
          value.updated_at = new Date().toISOString()
          fs.writeFileSync('release/channels/stable.json', `${JSON.stringify(value, null, 2)}\n`)
          NODE
          node scripts/verify-update-channel-index.mjs release/channels/stable.json stable
          git config user.name 'niupanel-release-bot'
          git config user.email 'release-bot@users.noreply.github.com'
          git add release/channels/stable.json
          git diff --cached --quiet || git commit -m "release: promote ${PANEL_TAG} to stable"
          git pull --rebase origin main
          git push origin HEAD:main
