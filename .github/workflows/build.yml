name: Publish NiuPanel Release

# 正式应用发布只由 v* Tag 触发。Docker 镜像是独立的环境产物，
# 由 docker.yml 按需从已经发布且校验过的 Core 包构建。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  version-contract:
    name: Verify release contract
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      core_version: ${{ steps.metadata.outputs.core_version }}
      web_version: ${{ steps.metadata.outputs.web_version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify and export release metadata
        id: metadata
        run: |
          CORE_VERSION=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' niupanel/Cargo.toml | head -n 1)
          WEB_VERSION=$(node -p "require('./niupanelweb/package.json').version")
          RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          node scripts/verify-version-contract.mjs "$GITHUB_REF_NAME"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build Web release
    needs: version-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
          run_install: false

      - name: Build Web release
        env:
          NIUPANEL_WEB_CORE_MIN: ${{ needs.version-contract.outputs.core_version }}
        run: |
          cd niupanelweb
          pnpm install --frozen-lockfile
          pnpm run build
          WEB_VERSION=$(node -p "require('./package.json').version")
          test -f dist/release-manifest.json
          tar -czvf "../niupanel_web_${WEB_VERSION}.tar.gz" -C dist .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: niupanel_web
          path: niupanel_web_*.tar.gz
          retention-days: 1

  build:
    name: Build Core (${{ matrix.arch }})
    needs: [version-contract, build-web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7

    steps:
      - uses: actions/checkout@v4

      - name: Download Web artifact
        uses: actions/download-artifact@v4
        with:
          name: niupanel_web
          path: web-artifact

      - name: Extract Web artifact
        run: |
          mkdir -p niupanelweb/dist
          tar -xzf web-artifact/niupanel_web_*.tar.gz -C niupanelweb/dist

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Build Backend
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cross build --release --target ${{ matrix.target }} -p niupanel -p niupanel-launcher

      - name: Package
        run: |
          ARCH_NAME=${{ matrix.arch }}
          DIST_DIR="niupanel_linux_$ARCH_NAME"
          mkdir -p "$DIST_DIR/web" "$DIST_DIR/tools"
          cp target/${{ matrix.target }}/release/niupanel "$DIST_DIR/"
          cp target/${{ matrix.target }}/release/niupanel-launcher "$DIST_DIR/"
          CORE_VERSION="${{ needs.version-contract.outputs.core_version }}"
          node scripts/generate-core-release-manifest.mjs \
            "$DIST_DIR/niupanel" \
            "$CORE_VERSION" \
            "${{ matrix.target }}" \
            "$DIST_DIR/core-release.json"
          cp -r niupanelweb/dist/. "$DIST_DIR/web/"
          scripts/prepare-runtime-tools.sh "$ARCH_NAME" "$DIST_DIR/tools"
          rm -f "$DIST_DIR/tools/.uv-version" "$DIST_DIR/tools/.pnpm-version" "$DIST_DIR/tools/fnm"
          test -x "$DIST_DIR/tools/uv"
          test -x "$DIST_DIR/tools/pnpm"
          tar -czvf "niupanel_linux_$ARCH_NAME.tar.gz" -C "$DIST_DIR" .

      - name: Upload Core artifact
        uses: actions/upload-artifact@v4
        with:
          name: niupanel_linux_${{ matrix.arch }}
          path: niupanel_linux_${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version-contract, build, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release manifest
        run: |
          node scripts/generate-release-manifest.mjs \
            artifacts \
            "${{ needs.version-contract.outputs.release_version }}" \
            "${{ github.sha }}" \
            niupanel-release.json

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ github.token }}
          generate_release_notes: true
          files: |
            artifacts/niupanel_linux_x86_64/niupanel_linux_x86_64.tar.gz
            artifacts/niupanel_linux_aarch64/niupanel_linux_aarch64.tar.gz
            artifacts/niupanel_linux_armv7/niupanel_linux_armv7.tar.gz
            artifacts/niupanel_web/niupanel_web_*.tar.gz
            niupanel-release.json
