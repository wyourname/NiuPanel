name: Publish NiuPanel Release

# v* Tag 只构建一次并创建 Pre-release。测试完成后，手动选择
# promote-stable 将同一个 GitHub Release 提升为正式版，不重建或替换资产。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      operation:
        description: '发布预览版，或将已测试的同一 Release 提升为正式版'
        required: true
        default: publish-prerelease
        type: choice
        options:
          - publish-prerelease
          - promote-stable
      release_tag:
        description: '纯数字应用版本 Tag，例如 v0.8.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version-contract:
    name: Verify release contract
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      operation: ${{ steps.metadata.outputs.operation }}
      core_version: ${{ steps.metadata.outputs.core_version }}
      web_version: ${{ steps.metadata.outputs.web_version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and export release metadata
        id: metadata
        env:
          OPERATION_INPUT: ${{ inputs.operation }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            OPERATION="$OPERATION_INPUT"
            RELEASE_TAG="$RELEASE_TAG_INPUT"
          else
            OPERATION=publish-prerelease
            RELEASE_TAG="$GITHUB_REF_NAME"
          fi
          if [[ "$OPERATION" != 'publish-prerelease' && "$OPERATION" != 'promote-stable' ]]; then
            echo "Unsupported release operation: $OPERATION" >&2
            exit 1
          fi
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must use a plain numeric version, for example v0.8.1' >&2
            exit 1
          fi
          RELEASE_VERSION="${RELEASE_TAG#v}"
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git checkout --detach "$SOURCE_SHA"
          CORE_VERSION=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' niupanel/Cargo.toml | head -n 1)
          WEB_VERSION=$(node -p "require('./niupanelweb/package.json').version")
          node scripts/verify-version-contract.mjs "$RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "operation=$OPERATION" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build Web release
    needs: version-contract
    if: needs.version-contract.outputs.operation == 'publish-prerelease'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-contract.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.18.0
          run_install: false

      - name: Build Web release
        env:
          NIUPANEL_WEB_CORE_MIN: ${{ needs.version-contract.outputs.core_version }}
        run: |
          cd niupanelweb
          pnpm install --frozen-lockfile
          pnpm run build
          WEB_VERSION=$(node -p "require('./package.json').version")
          test -f dist/release-manifest.json
          tar -czvf "../niupanel_web_${WEB_VERSION}.tar.gz" -C dist .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: niupanel_web
          path: niupanel_web_*.tar.gz
          retention-days: 1

  build:
    name: Build Core (${{ matrix.arch }})
    needs: version-contract
    if: needs.version-contract.outputs.operation == 'publish-prerelease'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-contract.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Build Backend
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cross build --release --target ${{ matrix.target }} -p niupanel -p niupanel-launcher

      - name: Package
        run: |
          ARCH_NAME=${{ matrix.arch }}
          DIST_DIR="niupanel_linux_$ARCH_NAME"
          mkdir -p "$DIST_DIR/tools"
          cp target/${{ matrix.target }}/release/niupanel "$DIST_DIR/"
          cp target/${{ matrix.target }}/release/niupanel-launcher "$DIST_DIR/"
          CORE_VERSION="${{ needs.version-contract.outputs.core_version }}"
          node scripts/generate-core-release-manifest.mjs \
            "$DIST_DIR/niupanel" \
            "$CORE_VERSION" \
            "${{ matrix.target }}" \
            "$DIST_DIR/core-release.json"
          scripts/prepare-runtime-tools.sh "$ARCH_NAME" "$DIST_DIR/tools"
          rm -f "$DIST_DIR/tools/.uv-version" "$DIST_DIR/tools/.pnpm-version" "$DIST_DIR/tools/fnm"
          test -x "$DIST_DIR/tools/uv"
          test -x "$DIST_DIR/tools/pnpm"
          tar -czvf "niupanel_linux_$ARCH_NAME.tar.gz" -C "$DIST_DIR" .

      - name: Upload Core artifact
        uses: actions/upload-artifact@v6
        with:
          name: niupanel_linux_${{ matrix.arch }}
          path: niupanel_linux_${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    name: Publish GitHub Pre-release
    needs: [version-contract, build, build-web]
    if: needs.version-contract.outputs.operation == 'publish-prerelease'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-contract.outputs.source_sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Assemble and verify release bundle
        env:
          NIUPANEL_REQUIRE_ALL_CORE_ASSETS: '1'
        run: |
          mkdir -p release-assets
          cp artifacts/niupanel_linux_x86_64/niupanel_linux_x86_64.tar.gz release-assets/
          cp artifacts/niupanel_linux_aarch64/niupanel_linux_aarch64.tar.gz release-assets/
          cp artifacts/niupanel_linux_armv7/niupanel_linux_armv7.tar.gz release-assets/
          web_assets=(artifacts/niupanel_web/niupanel_web_*.tar.gz)
          test "${#web_assets[@]}" -eq 1
          cp "${web_assets[0]}" release-assets/
          node scripts/generate-release-manifest.mjs \
            release-assets \
            "${{ needs.version-contract.outputs.release_version }}" \
            "${{ needs.version-contract.outputs.source_sha }}" \
            release-assets/niupanel-release.json
          node scripts/verify-release-bundle.mjs \
            release-assets/niupanel-release.json \
            release-assets \
            --expected-version "${{ needs.version-contract.outputs.release_version }}" \
            --expected-git-sha "${{ needs.version-contract.outputs.source_sha }}" \
            --require-all-core-assets

      - name: Publish release
        env:
          # 使用 fine-grained PAT（Repository contents: Read and write）时优先使用它；
          # 未配置时回退到工作流的 GITHUB_TOKEN。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.version-contract.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.version-contract.outputs.release_version }}
          SOURCE_SHA: ${{ needs.version-contract.outputs.source_sha }}
        run: |
          set -euo pipefail
          assets=(release-assets/*)

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_PRERELEASE=$(gh release view "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease \
              --jq '.isPrerelease')
            if [[ "$IS_PRERELEASE" != 'true' ]]; then
              echo "$RELEASE_TAG is already stable; published assets are immutable" >&2
              exit 1
            fi
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NiuPanel $RELEASE_VERSION"
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$SOURCE_SHA"
            --title "NiuPanel $RELEASE_VERSION"
            --generate-notes
            --prerelease
          )
          gh release create "${release_args[@]}" "${assets[@]}"

  promote-stable:
    name: Promote tested Release to stable
    needs: version-contract
    if: needs.version-contract.outputs.operation == 'promote-stable'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout released source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-contract.outputs.source_sha }}
          fetch-depth: 0

      - name: Verify immutable release bundle and promote
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.version-contract.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.version-contract.outputs.release_version }}
          SOURCE_SHA: ${{ needs.version-contract.outputs.source_sha }}
        run: |
          set -euo pipefail
          RELEASE_STATE=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease,targetCommitish)
          if [[ "$(jq -r '.isDraft' <<<"$RELEASE_STATE")" != 'false' ]]; then
            echo "$RELEASE_TAG is still a draft" >&2
            exit 1
          fi
          if [[ "$(jq -r '.isPrerelease' <<<"$RELEASE_STATE")" != 'true' ]]; then
            echo "$RELEASE_TAG is not a Pre-release awaiting promotion" >&2
            exit 1
          fi
          if [[ "$(jq -r '.targetCommitish' <<<"$RELEASE_STATE")" != "$SOURCE_SHA" ]]; then
            echo "$RELEASE_TAG does not point to the expected source commit" >&2
            exit 1
          fi

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern niupanel-release.json \
            --pattern 'niupanel_linux_*.tar.gz' \
            --pattern 'niupanel_web_*.tar.gz'
          node scripts/verify-release-bundle.mjs \
            release-assets/niupanel-release.json \
            release-assets \
            --expected-version "$RELEASE_VERSION" \
            --expected-git-sha "$SOURCE_SHA" \
            --require-all-core-assets

          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --prerelease=false \
            --latest
