name: Publish Docker Image

on:
  push:
    branches: [main]
    paths:
      - release/channels/preview.json
      - release/channels/stable.json
  workflow_dispatch:
    inputs:
      channel:
        description: '要构建的组件通道'
        required: true
        default: preview
        type: choice
        options: [preview, stable]
      docker_version:
        description: '覆盖 docker/VERSION；留空读取仓库版本'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: niupanel-docker-publish
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docker source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 1

      - name: Select changed update channel
        id: channel
        env:
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: |
          set -euo pipefail
          if [ -n "$CHANNEL_INPUT" ]; then
            CHANNEL="$CHANNEL_INPUT"
          else
            CHANGED=$(git diff-tree --root --no-commit-id --name-only -r HEAD)
          fi
          if [ -z "${CHANNEL:-}" ]; then
            if grep -qx 'release/channels/stable.json' <<<"$CHANGED"; then
              CHANNEL=stable
            elif grep -qx 'release/channels/preview.json' <<<"$CHANGED"; then
              CHANNEL=preview
            else
              echo 'No update channel index changed' >&2
              exit 1
            fi
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Download and verify indexed component assets
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail
          INDEX="release/channels/${CHANNEL}.json"
          export INDEX
          node scripts/verify-update-channel-index.mjs "$INDEX" "$CHANNEL"
          CORE_TAG=$(node -p "require('./' + process.env.INDEX).core.tag")
          WEB_TAG=$(node -p "require('./' + process.env.INDEX).web.tag")
          CORE_VERSION=$(node -p "require('./' + process.env.INDEX).core.version")
          WEB_VERSION=$(node -p "require('./' + process.env.INDEX).web.version")
          mkdir release-assets
          gh release download "$CORE_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern niupanel_linux_x86_64.tar.gz \
            --pattern niupanel_linux_aarch64.tar.gz \
            --pattern niupanel_linux_armv7.tar.gz
          gh release download "$WEB_TAG" --repo "$GITHUB_REPOSITORY" --dir release-assets \
            --pattern 'niupanel_web_*.tar.gz'
          node scripts/verify-update-channel-assets.mjs "$INDEX" release-assets
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker build context
        run: |
          set -euo pipefail
          mkdir -p docker/packages/amd64 docker/packages/arm64 docker/packages/arm docker/packages/web
          cp release-assets/niupanel_linux_x86_64.tar.gz docker/packages/amd64/niupanel.tar.gz
          cp release-assets/niupanel_linux_aarch64.tar.gz docker/packages/arm64/niupanel.tar.gz
          cp release-assets/niupanel_linux_armv7.tar.gz docker/packages/arm/niupanel.tar.gz
          cp release-assets/niupanel_web_*.tar.gz docker/packages/web/niupanel_web.tar.gz

      - name: Determine Docker environment version
        id: version
        env:
          DOCKER_VERSION_INPUT: ${{ inputs.docker_version }}
        run: |
          set -euo pipefail
          VERSION="${DOCKER_VERSION_INPUT:-$(tr -d '[:space:]' < docker/VERSION)}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Docker environment version must be a stable semantic version: $VERSION" >&2
            exit 1
          fi
          echo "environment_version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/niupanel:${{ steps.version.outputs.environment_version }}
            ${{ secrets.DOCKER_USERNAME }}/niupanel:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.niupanel.update.channel=${{ steps.channel.outputs.channel }}
          build-args: |
            NIUPANEL_ENVIRONMENT_VERSION=${{ steps.version.outputs.environment_version }}
            NIUPANEL_CORE_VERSION=${{ steps.release.outputs.core_version }}
            NIUPANEL_WEB_VERSION=${{ steps.release.outputs.web_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
