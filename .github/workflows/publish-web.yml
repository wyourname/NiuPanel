name: Publish Web Pre-release

on:
  push:
    tags:
      - 'web-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Web Tag，例如 web-v2.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-web-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Verify Web release contract
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must use web-v<major>.<minor>.<patch>' >&2
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_SHA")
          git checkout --detach "$SOURCE_SHA"
          node scripts/verify-version-contract.mjs "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"

  build:
    name: Build Web release
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.18.0
          run_install: false

      - name: Build Web archive
        env:
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          cd niupanelweb
          pnpm install --frozen-lockfile
          pnpm run build
          WEB_VERSION=$(node -p "require('./package.json').version")
          test -f dist/release-manifest.json
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner -cf - -C dist . \
            | gzip -n > "../niupanel_web_${WEB_VERSION}.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: niupanel_web
          path: niupanel_web_*.tar.gz
          retention-days: 1

  release:
    name: Publish Web GitHub Pre-release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: niupanel_web
          path: release-assets

      - name: Generate Web component descriptor
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          node scripts/generate-update-component.mjs \
            web release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG" web-component.json

      - name: Publish immutable Web asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'RELEASE_TOKEN is required' >&2; exit 1; }
          assets=(release-assets/niupanel_web_*.tar.gz)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != true ]; then
              IS_PRERELEASE=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json isPrerelease --jq .isPrerelease)
              test "$IS_PRERELEASE" = true
              mkdir published-assets
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --dir published-assets --pattern 'niupanel_web_*.tar.gz'
              test "$(find published-assets -maxdepth 1 -type f | wc -l)" = 1
              cmp --silent "${assets[0]}" "published-assets/$(basename "${assets[0]}")"
              echo "$RELEASE_TAG is already published with an identical immutable asset"
              exit 0
            fi
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "NiuPanel Web ${RELEASE_TAG#web-v}" \
              --generate-notes \
              --prerelease \
              --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          ASSET_COUNT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          test "$ASSET_COUNT" = 1
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=true

      - uses: actions/upload-artifact@v6
        with:
          name: web-component
          path: web-component.json
          retention-days: 1
