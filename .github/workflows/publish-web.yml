name: Publish Web Pre-release

on:
  push:
    tags:
      - 'web-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Web Tag，例如 web-v2.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-web-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Verify Web release contract
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      source_sha: ${{ steps.release.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^web-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must use web-v<major>.<minor>.<patch>' >&2
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git checkout --detach "$SOURCE_SHA"
          node scripts/verify-version-contract.mjs "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"

  build:
    name: Build Web release
    needs: metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.18.0
          run_install: false

      - name: Build Web archive
        run: |
          set -euo pipefail
          cd niupanelweb
          pnpm install --frozen-lockfile
          pnpm run build
          WEB_VERSION=$(node -p "require('./package.json').version")
          test -f dist/release-manifest.json
          tar -czvf "../niupanel_web_${WEB_VERSION}.tar.gz" -C dist .

      - uses: actions/upload-artifact@v6
        with:
          name: niupanel_web
          path: niupanel_web_*.tar.gz
          retention-days: 1

  release:
    name: Publish Web GitHub Pre-release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: niupanel_web
          path: release-assets

      - name: Generate Web component descriptor
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          node scripts/generate-update-component.mjs \
            web release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG" web-component.json

      - name: Publish immutable Web asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'RELEASE_TOKEN is required' >&2; exit 1; }
          assets=(release-assets/niupanel_web_*.tar.gz)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
            gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "NiuPanel Web ${RELEASE_TAG#web-v}" \
              --generate-notes \
              --prerelease
          fi

      - uses: actions/upload-artifact@v6
        with:
          name: web-component
          path: web-component.json
          retention-days: 1

  update-preview-index:
    name: Update Preview channel index
    needs: [metadata, release]
    runs-on: ubuntu-latest
    concurrency:
      group: niupanel-release-index-preview
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - uses: actions/download-artifact@v8
        with:
          name: web-component
          path: component

      - name: Check Preview index initialization
        id: index
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TOKEN" || { echo 'RELEASE_TOKEN is required' >&2; exit 1; }
          set +e
          git ls-remote --exit-code --heads \
            "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            release-index >/dev/null 2>&1
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          elif [ "$status" -eq 2 ]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          else
            echo "Unable to read release-index branch (git exit $status)" >&2
            exit "$status"
          fi

      - uses: actions/checkout@v6
        if: steps.index.outputs.ready == 'true'
        with:
          ref: release-index
          path: update-index
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Check Preview channel initialization
        if: steps.index.outputs.ready == 'true'
        id: channel
        run: |
          if [ -f update-index/preview.json ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Explain initial index setup
        if: steps.index.outputs.ready != 'true' || steps.channel.outputs.ready != 'true'
        run: |
          echo 'Web pre-release is published. Run Bootstrap Update Channel Index for preview after the first Core and Web pre-releases are available.'

      - name: Update and publish Preview index
        if: steps.channel.outputs.ready == 'true'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_TOKEN" || { echo 'RELEASE_TOKEN is required' >&2; exit 1; }
          node scripts/update-channel-index.mjs update-index/preview.json preview web component/web-component.json
          node scripts/verify-update-channel-index.mjs update-index/preview.json preview
          mkdir -p update-index/.github/workflows
          cp .github/workflows/docker.yml update-index/.github/workflows/docker.yml
          git -C update-index config user.name 'niupanel-release-bot'
          git -C update-index config user.email 'release-bot@users.noreply.github.com'
          git -C update-index add preview.json .github/workflows/docker.yml
          git -C update-index diff --cached --quiet || git -C update-index commit -m 'release: update preview Web'
          git -C update-index push origin HEAD:release-index
