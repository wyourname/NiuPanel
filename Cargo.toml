[workspace]
resolver = "2"
members = [
    "niupanel",
    "migration",
    "niupanel-common",
    "niupanel-entity",
    "niupanel-plugin",
    "niupanel-core",
    "niupanel-sdk",
    "niupanel-proxy",
    "niupanel-bot",
    "niupanel-launcher",
]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/wyourname/NiuPanel.git"
homepage = "https://github.com/wyourname/NiuPanel"
authors = ["NiuPanel contributors"]

[workspace.dependencies]
tokio = { version = "1.49.0", features = ["full"] }
sea-orm = { version = "1.1.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio-rustls", "tls-rustls", "chrono", "json"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.134"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "time", "local-time"] }
tracing-appender = "0.2.3"
chrono = { version = "0.4.39", features = ["serde"] }
anyhow = "1.0.95"
thiserror = "2.0.17"
axum = { version = "0.8.8", features = ["multipart", "ws"] }
tower = "0.5.2"
tower-http = { version = "0.6.7", features = ["cors", "trace", "fs"] }
futures = "0.3.31"
reqwest = { version = "0.12.25", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "hickory-dns", "socks"] }
dashmap = "6.1.0"
moka = "0.12.12"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
flate2 = "1.1.5"
nanoid = "0.4.0"
rmp-serde = "1.3.1"
openssl = { version = "0.10", features = ["vendored"] }
tempfile = "3.24.0"
serde_bytes = "0.11.19"
envy = "0.4"
dotenvy = "0.15.7"
http = "1.1"
semver = "1.0.27"
libsqlite3-sys = { version = "0.30", features = ["bundled"] }
libc = "0.2.186"
landlock = "0.4.5"
sea-orm-migration = { version = "1.1.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-json"] }
tokio-cron-scheduler = "0.15.1"
nix = { version = "0.30.1", features = ["signal", "term", "resource", "process"] }
cron = "0.15.0"
sysinfo = "0.37.2"
chrono-tz = "0.10.4"
shell-words = "1.1.1"
lettre = { version = "0.11.19", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "pool"] }
walkdir = "2.5.0"
tar = "0.4.44"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
argon2 = "0.5.3"
tower-sessions = { version = "0.14", features = ["signed"] }
tower-sessions-sqlx-store = { version = "0.15.0", features = ["sqlite"] }
tower-cookies = { version = "0.11.0", features = ["signed"] }
time = { version = "0.3.34", features = ["macros", "serde"] }
tokio-util = { version = "0.7.17", features = ["codec", "io"] }
async-stream = "0.3.6"
rand = "0.9.0"
which = "7.0.1"
portable-pty = "0.9.0"
utoipa = { version = "5.4.0", features = ["chrono"] }

[profile.release]
opt-level = 3        # 3 = 最大性能优化
lto = true           # 启用 Link Time Optimization，整体性能提升                                                                               │
codegen-units = 1    # 减少并行 codegen 单元，有助于优化跨函数的内联                                                                           │
debug = false        # 去掉调试信息，减小体积
