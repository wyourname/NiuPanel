[workspace]
resolver = "2"
members = [
    "niupanel",
    "migration",
    "niupanel-common",
    "niupanel-entity",
    "niupanel-plugin",
    "niupanel-core",
    "niupanel-sdk",
    "niupanel-proxy",
    "niupanel-bot",
    "niupanel-launcher",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/wyourname/NiuPanel.git"
homepage = "https://github.com/wyourname/NiuPanel"
authors = ["NiuPanel contributors"]

[workspace.dependencies]
tokio = { version = "1.53.1", features = ["full"] }
sea-orm = { version = "2.0.0", default-features = false, features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "with-chrono", "with-json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "time", "local-time"] }
tracing-appender = "0.2.5"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
thiserror = "2.0.19"
axum = { version = "0.8.9", features = ["multipart", "ws"] }
tower = "0.5.3"
tower-http = { version = "0.7.0", features = ["cors", "trace", "fs"] }
futures = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "stream", "gzip", "brotli", "hickory-dns", "socks"] }
dashmap = "6.2.1"
moka = "0.12.15"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
flate2 = "1.1.9"
nanoid = "0.5.0"
rmp-serde = "1.3.1"
openssl = { version = "0.10", features = ["vendored"] }
tempfile = "3.27.0"
serde_bytes = "0.11.19"
envy = "0.4"
dotenvy = "0.15.7"
http = "1.5"
semver = "1.0.28"
# tower-sessions-sqlx-store 0.15 currently pins SQLx 0.8. The same SQLite
# binding is also accepted by SeaORM 2 / SQLx 0.9, so keep one shared binding.
libsqlite3-sys = { version = "0.30.1", features = ["bundled"] }
libc = "0.2.189"
landlock = "0.4.7"
sea-orm-migration = { version = "2.0.0", default-features = false, features = ["runtime-tokio-rustls", "sqlx-sqlite", "with-chrono", "with-json"] }
tokio-cron-scheduler = "0.15.1"
nix = { version = "0.31.3", features = ["signal", "term", "resource", "process"] }
cron = "0.17.0"
sysinfo = "0.39.6"
chrono-tz = "0.10.4"
shell-words = "1.1.1"
lettre = { version = "0.11.22", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "builder", "pool"] }
walkdir = "2.5.0"
tar = "0.4.46"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
argon2 = "0.5.3"
tower-sessions = { version = "0.15", features = ["signed"] }
# crates.io 0.15.0 is still built on SQLx 0.8 / Sessions Core 0.14. The
# upstream main branch has the SQLx 0.9 / Sessions 0.15 migration required by
# SeaORM 2; pin the reviewed commit until that release is published.
tower-sessions-sqlx-store = { git = "https://github.com/maxcountryman/tower-sessions-stores.git", rev = "75cb75792d0a8d9231723b07e7524897201ef73b", package = "tower-sessions-sqlx-store", features = ["sqlite"] }
tower-cookies = { version = "0.11.0", features = ["signed"] }
time = { version = "0.3.54", features = ["macros", "serde"] }
tokio-util = { version = "0.7.19", features = ["codec", "io"] }
async-stream = "0.3.6"
rand = "0.10.2"
which = "8.0.5"
portable-pty = "0.9.0"
utoipa = { version = "5.5.0", features = ["chrono"] }

[profile.release]
opt-level = 3        # 3 = 最大性能优化
lto = true           # 启用 Link Time Optimization，整体性能提升                                                                               │
codegen-units = 1    # 减少并行 codegen 单元，有助于优化跨函数的内联                                                                           │
debug = false        # 去掉调试信息，减小体积

# Teloxide's latest release and main branch still pull proc-macro-error2 2.0.1.
# Upstream has not released the one-line Rust future-incompatibility fix yet.
[patch.crates-io]
proc-macro-error2 = { path = "third_party/proc-macro-error2" }
