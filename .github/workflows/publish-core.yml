name: Publish Core Pre-release

on:
  push:
    tags:
      - 'Core-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Core Tag，例如 Core-v0.8.2'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-core-${{ github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Verify Core release contract
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      source_date_epoch: ${{ steps.release.outputs.source_date_epoch }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: release
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_TAG_INPUT:-$GITHUB_REF_NAME}"
          if ! [[ "$TAG" =~ ^Core-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must use Core-v<major>.<minor>.<patch>' >&2
            exit 1
          fi
          SOURCE_SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct "$SOURCE_SHA")
          git checkout --detach "$SOURCE_SHA"
          node scripts/verify-version-contract.mjs "$TAG"
          VERSION="${TAG#Core-v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_date_epoch=$SOURCE_DATE_EPOCH" >> "$GITHUB_OUTPUT"

  build:
    name: Build Core (${{ matrix.arch }})
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - uses: taiki-e/install-action@cross

      - name: Build and package Core
        env:
          CORE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ needs.metadata.outputs.source_date_epoch }}
        run: |
          set -euo pipefail
          export RUSTFLAGS='-C target-feature=+crt-static'
          cross build --release --target ${{ matrix.target }} -p niupanel -p niupanel-launcher
          DIST_DIR="niupanel_linux_${{ matrix.arch }}"
          mkdir -p "$DIST_DIR/tools"
          cp target/${{ matrix.target }}/release/niupanel "$DIST_DIR/"
          cp target/${{ matrix.target }}/release/niupanel-launcher "$DIST_DIR/"
          node scripts/generate-core-release-manifest.mjs \
            "$DIST_DIR/niupanel" \
            "$CORE_VERSION" \
            '${{ matrix.target }}' \
            "$DIST_DIR/core-release.json"
          scripts/prepare-runtime-tools.sh '${{ matrix.arch }}' "$DIST_DIR/tools"
          rm -f "$DIST_DIR/tools/.uv-version" "$DIST_DIR/tools/.pnpm-version" "$DIST_DIR/tools/fnm"
          test -x "$DIST_DIR/tools/uv"
          test -x "$DIST_DIR/tools/pnpm"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
            --owner=0 --group=0 --numeric-owner -cf - -C "$DIST_DIR" . \
            | gzip -n > "niupanel_linux_${{ matrix.arch }}.tar.gz"

      - uses: actions/upload-artifact@v6
        with:
          name: niupanel_linux_${{ matrix.arch }}
          path: niupanel_linux_${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    name: Publish Core GitHub Pre-release
    needs: [metadata, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.metadata.outputs.source_sha }}

      - uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Assemble and verify Core assets
        env:
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          mv release-assets/niupanel_linux_x86_64/niupanel_linux_x86_64.tar.gz release-assets/
          mv release-assets/niupanel_linux_aarch64/niupanel_linux_aarch64.tar.gz release-assets/
          mv release-assets/niupanel_linux_armv7/niupanel_linux_armv7.tar.gz release-assets/
          node scripts/generate-update-component.mjs \
            core release-assets "$GITHUB_REPOSITORY" "$RELEASE_TAG" core-component.json

      - name: Publish immutable Core assets
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          SOURCE_SHA: ${{ needs.metadata.outputs.source_sha }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'RELEASE_TOKEN is required' >&2; exit 1; }
          assets=(release-assets/niupanel_linux_*.tar.gz)
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            IS_DRAFT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json isDraft --jq .isDraft)
            if [ "$IS_DRAFT" != true ]; then
              IS_PRERELEASE=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --json isPrerelease --jq .isPrerelease)
              test "$IS_PRERELEASE" = true
              mkdir published-assets
              gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
                --dir published-assets --pattern 'niupanel_linux_*.tar.gz'
              test "$(find published-assets -maxdepth 1 -type f | wc -l)" = 3
              for asset in "${assets[@]}"; do
                cmp --silent "$asset" "published-assets/$(basename "$asset")"
              done
              echo "$RELEASE_TAG is already published with identical immutable assets"
              exit 0
            fi
            gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | while IFS= read -r asset; do
              gh release delete-asset "$RELEASE_TAG" "$asset" \
                --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            done
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" \
              --title "NiuPanel Core $RELEASE_VERSION" \
              --generate-notes \
              --prerelease \
              --draft
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --repo "$GITHUB_REPOSITORY"
          ASSET_COUNT=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets | length')
          test "$ASSET_COUNT" = 3
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --draft=false --prerelease=true

      - uses: actions/upload-artifact@v6
        with:
          name: core-component
          path: core-component.json
          retention-days: 1
