name: Publish NiuPanel Release

# 应用发布由 v* Tag 或手动触发。手动从 main 构建正式 Release，
# 从 dev 构建 Pre-release；Docker 镜像始终由 docker.yml 独立按需构建。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: '要创建的应用 Release Tag；main 使用 v0.8.0，dev 使用 v0.8.1-dev.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  version-contract:
    name: Verify release contract
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.metadata.outputs.release_version }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      core_version: ${{ steps.metadata.outputs.core_version }}
      web_version: ${{ steps.metadata.outputs.web_version }}
      source_sha: ${{ steps.metadata.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify and export release metadata
        id: metadata
        env:
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          CORE_VERSION=$(sed -n '/^\[package\]/,/^\[/{s/^version = "\([^"]*\)"/\1/p}' niupanel/Cargo.toml | head -n 1)
          WEB_VERSION=$(node -p "require('./niupanelweb/package.json').version")
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            RELEASE_TAG="$RELEASE_TAG_INPUT"
            case "$GITHUB_REF_NAME" in
              main) IS_PRERELEASE=false ;;
              dev) IS_PRERELEASE=true ;;
              *)
                echo "Manual releases must run from main (stable) or dev (pre-release), got $GITHUB_REF_NAME" >&2
                exit 1
                ;;
            esac
          else
            RELEASE_TAG="$GITHUB_REF_NAME"
            if [[ "$RELEASE_TAG" == *-* ]]; then
              IS_PRERELEASE=true
            else
              IS_PRERELEASE=false
            fi
          fi
          case "$RELEASE_TAG" in
            v*) ;;
            *) echo 'release_tag must start with v, for example v0.8.0' >&2; exit 1 ;;
          esac
          RELEASE_VERSION="${RELEASE_TAG#v}"
          if [[ "$IS_PRERELEASE" == true && "$RELEASE_VERSION" != *-* ]]; then
            echo "Pre-release tags must include a prerelease suffix, for example v0.8.1-dev.1" >&2
            exit 1
          fi
          if [[ "$IS_PRERELEASE" == false && "$RELEASE_VERSION" == *-* ]]; then
            echo "Stable releases cannot use a prerelease suffix" >&2
            exit 1
          fi
          node scripts/verify-version-contract.mjs "$RELEASE_TAG"
          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-web:
    name: Build Web release
    needs: version-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-contract.outputs.source_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4.4.0
        with:
          version: 11.18.0
          run_install: false

      - name: Build Web release
        env:
          NIUPANEL_WEB_CORE_MIN: ${{ needs.version-contract.outputs.core_version }}
        run: |
          cd niupanelweb
          pnpm install --frozen-lockfile
          pnpm run build
          WEB_VERSION=$(node -p "require('./package.json').version")
          test -f dist/release-manifest.json
          tar -czvf "../niupanel_web_${WEB_VERSION}.tar.gz" -C dist .

      - name: Upload Web artifact
        uses: actions/upload-artifact@v6
        with:
          name: niupanel_web
          path: niupanel_web_*.tar.gz
          retention-days: 1

  build:
    name: Build Core (${{ matrix.arch }})
    needs: version-contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
          - target: armv7-unknown-linux-musleabihf
            arch: armv7

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-contract.outputs.source_sha }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libssl-dev

      - name: Install Cross
        uses: taiki-e/install-action@cross

      - name: Build Backend
        run: |
          export RUSTFLAGS="-C target-feature=+crt-static"
          cross build --release --target ${{ matrix.target }} -p niupanel -p niupanel-launcher

      - name: Package
        run: |
          ARCH_NAME=${{ matrix.arch }}
          DIST_DIR="niupanel_linux_$ARCH_NAME"
          mkdir -p "$DIST_DIR/tools"
          cp target/${{ matrix.target }}/release/niupanel "$DIST_DIR/"
          cp target/${{ matrix.target }}/release/niupanel-launcher "$DIST_DIR/"
          CORE_VERSION="${{ needs.version-contract.outputs.core_version }}"
          node scripts/generate-core-release-manifest.mjs \
            "$DIST_DIR/niupanel" \
            "$CORE_VERSION" \
            "${{ matrix.target }}" \
            "$DIST_DIR/core-release.json"
          scripts/prepare-runtime-tools.sh "$ARCH_NAME" "$DIST_DIR/tools"
          rm -f "$DIST_DIR/tools/.uv-version" "$DIST_DIR/tools/.pnpm-version" "$DIST_DIR/tools/fnm"
          test -x "$DIST_DIR/tools/uv"
          test -x "$DIST_DIR/tools/pnpm"
          tar -czvf "niupanel_linux_$ARCH_NAME.tar.gz" -C "$DIST_DIR" .

      - name: Upload Core artifact
        uses: actions/upload-artifact@v6
        with:
          name: niupanel_linux_${{ matrix.arch }}
          path: niupanel_linux_${{ matrix.arch }}.tar.gz
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: [version-contract, build, build-web]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-contract.outputs.source_sha }}
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Generate release manifest
        run: |
          node scripts/generate-release-manifest.mjs \
            artifacts \
            "${{ needs.version-contract.outputs.release_version }}" \
            "${{ github.sha }}" \
            niupanel-release.json

      - name: Publish release
        env:
          # 使用 fine-grained PAT（Repository contents: Read and write）时优先使用它；
          # 未配置时回退到工作流的 GITHUB_TOKEN。
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.version-contract.outputs.release_tag }}
          RELEASE_VERSION: ${{ needs.version-contract.outputs.release_version }}
          SOURCE_SHA: ${{ needs.version-contract.outputs.source_sha }}
          IS_PRERELEASE: ${{ needs.version-contract.outputs.prerelease }}
        run: |
          set -euo pipefail
          web_assets=(artifacts/niupanel_web/niupanel_web_*.tar.gz)
          test -f "${web_assets[0]}"
          assets=(
            artifacts/niupanel_linux_x86_64/niupanel_linux_x86_64.tar.gz
            artifacts/niupanel_linux_aarch64/niupanel_linux_aarch64.tar.gz
            artifacts/niupanel_linux_armv7/niupanel_linux_armv7.tar.gz
            "${web_assets[0]}"
            niupanel-release.json
          )

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "NiuPanel $RELEASE_VERSION"
            gh release upload "$RELEASE_TAG" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            exit 0
          fi

          release_args=(
            "$RELEASE_TAG"
            --repo "$GITHUB_REPOSITORY"
            --target "$SOURCE_SHA"
            --title "NiuPanel $RELEASE_VERSION"
            --generate-notes
          )
          if [[ "$IS_PRERELEASE" == 'true' ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "${release_args[@]}" "${assets[@]}"
