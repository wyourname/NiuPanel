name: Publish Docker Image

# Docker 是独立的稳定环境交付物：只从 main 和已发布的稳定 Core 构建，
# 不会在应用 Release 时自动执行，也不发布 Pre-release 镜像。
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '已发布的稳定 Core GitHub Release Tag，例如 v0.8.0'
        required: true
        type: string
      docker_version:
        description: '覆盖 main 中的 docker/VERSION；留空读取 docker/VERSION'
        required: false
        type: string

permissions:
  contents: read

# 环境标签和 latest 都是可变标签，禁止两个构建同时覆盖它们。
concurrency:
  group: niupanel-docker-publish
  cancel-in-progress: false

jobs:
  docker:
    name: Build and push multi-architecture image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Docker source
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Download and verify published Core and Web packages
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'release_tag must use a plain numeric version, for example v0.8.1' >&2
            exit 1
          fi
          RELEASE_STATE=$(gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json isDraft,isPrerelease)
          if [[ "$(jq -r '.isDraft' <<<"$RELEASE_STATE")" != 'false' ]]; then
            echo "$RELEASE_TAG is still a draft" >&2
            exit 1
          fi
          if [[ "$(jq -r '.isPrerelease' <<<"$RELEASE_STATE")" != 'false' ]]; then
            echo "$RELEASE_TAG is still a Pre-release; promote it before publishing Docker" >&2
            exit 1
          fi

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern niupanel-release.json \
            --pattern niupanel_linux_x86_64.tar.gz \
            --pattern niupanel_linux_aarch64.tar.gz \
            --pattern niupanel_linux_armv7.tar.gz \
            --pattern 'niupanel_web_*.tar.gz'

          node scripts/verify-release-bundle.mjs \
            release-assets/niupanel-release.json \
            release-assets \
            --expected-version "$RELEASE_TAG" \
            --require-all-core-assets > release-metadata.json
          CORE_VERSION=$(node -p "require('./release-metadata.json').core_version")
          WEB_VERSION=$(node -p "require('./release-metadata.json').web_version")
          WEB_ARCHIVE=$(node -p "require('./release-metadata.json').web_asset")
          echo "core_version=$CORE_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_version=$WEB_VERSION" >> "$GITHUB_OUTPUT"
          echo "web_archive=$WEB_ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Prepare Docker build context
        run: |
          mkdir -p docker/packages/amd64 docker/packages/arm64 docker/packages/arm docker/packages/web
          cp release-assets/niupanel_linux_x86_64.tar.gz docker/packages/amd64/niupanel.tar.gz
          cp release-assets/niupanel_linux_aarch64.tar.gz docker/packages/arm64/niupanel.tar.gz
          cp release-assets/niupanel_linux_armv7.tar.gz docker/packages/arm/niupanel.tar.gz
          cp "release-assets/${{ steps.release.outputs.web_archive }}" docker/packages/web/niupanel_web.tar.gz

      - name: Determine Docker environment version
        id: version
        env:
          DOCKER_VERSION_INPUT: ${{ inputs.docker_version }}
        run: |
          if [ -n "$DOCKER_VERSION_INPUT" ]; then
            VERSION="$DOCKER_VERSION_INPUT"
          else
            VERSION="$(tr -d '[:space:]' < docker/VERSION)"
          fi
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Docker environment version must be stable semantic version: $VERSION" >&2
            exit 1
          fi
          echo "environment_version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/niupanel:${{ steps.version.outputs.environment_version }}
            ${{ secrets.DOCKER_USERNAME }}/niupanel:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            NIUPANEL_ENVIRONMENT_VERSION=${{ steps.version.outputs.environment_version }}
            NIUPANEL_CORE_VERSION=${{ steps.release.outputs.core_version }}
            NIUPANEL_WEB_VERSION=${{ steps.release.outputs.web_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
